org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+ParallelRefProcEnabled
android.useAndroidX=true
android.enableJetifier=true
# Configuration optimisée du daemon Kotlin pour Windows
kotlin.incremental=false
kotlin.daemon.jvmopts=-Xmx3G -XX:MaxMetaspaceSize=1G
kotlin.daemon.affinity=single_worker
# Désactiver le Gradle daemon problématique
org.gradle.daemon=false
# Optimisations Gradle
org.gradle.parallel=true
org.gradle.workers.max=4
android.aapt2FromMavenOverride=
